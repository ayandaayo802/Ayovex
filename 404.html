<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page Not Found | Ayovex Interior</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪑</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .error-code {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #fff 0%, #666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .error-title {
      font-size: 1.2rem;
      font-weight: 500;
      color: #a3a3a3;
      margin-bottom: 40px;
    }
    .error-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: #fff;
      color: #000;
      border-radius: 50px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s ease;
    }
    .error-home:hover {
      background: #e5e5e5;
      transform: translateY(-2px);
    }
    .error-logo {
      margin-bottom: 48px;
    }
    .error-logo .logo-main {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff;
    }
    .error-logo .logo-sub {
      font-size: 0.55rem;
      letter-spacing: 5px;
      color: #737373;
      margin-top: 2px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-logo">
      <span class="logo-main">AYOVEX</span>
      <span class="logo-sub">INTERIOR</span>
    </div>
    <div class="error-code">404</div>
    <p class="error-title">The page you're looking for doesn't exist.</p>
    <a href="index.html" class="error-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Back to Home
    </a>
  </div>
</body>
</html>
